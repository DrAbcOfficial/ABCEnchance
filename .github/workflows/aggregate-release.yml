name: Aggregate Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aggregate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.config }} (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            variant: classic
          - config: Release
            variant: classic
          - config: Release
            variant: division
    steps:
      # AbcUi pins a Renderer commit that is only published in this fork.
      - name: Route Renderer through the fork
        shell: pwsh
        run: |
          git config --global url."https://github.com/DrAbcOfficial/Renderer".insteadOf "https://github.com/MetaHookSv/Renderer"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
          submodules: recursive

      # The runner image ships an older CMake than the projects require; the
      # newest release number is resolved at run time through the GitHub CLI.
      - name: Install the latest CMake
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh api repos/Kitware/CMake/releases/latest --jq .tag_name
          if (-not $tag) { throw 'Could not resolve the latest CMake release' }
          $version = $tag.TrimStart('v')
          $url = "https://github.com/Kitware/CMake/releases/download/$tag/cmake-$version-windows-x86_64.zip"
          Write-Host "Installing CMake $version from $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\cmake.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\cmake.zip" -DestinationPath "$env:RUNNER_TEMP\cmake" -Force
          "$env:RUNNER_TEMP\cmake\cmake-$version-windows-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure aggregate build
        shell: pwsh
        run: |
          cmake --version
          $generator = 'Visual Studio 17 2022'
          $instance = $null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $instances = & $vswhere -all -prerelease -products * -format json | ConvertFrom-Json
            $latest = $instances | Sort-Object { [int]($_.installationVersion.Split('.')[0]) } -Descending | Select-Object -First 1
            if ($latest) {
              $instance = $latest.installationPath
              $major = [int]$latest.installationVersion.Split('.')[0]
              if ($major -ge 18) { $generator = 'Visual Studio 18 2026' } else { $generator = 'Visual Studio 17 2022' }
            }
          }
          Write-Host "Generating with '$generator' (instance: '$instance')"
          if ($instance) {
            cmake -S . -B build/ci -G $generator -A Win32 -DCMAKE_GENERATOR_INSTANCE="$instance" -DABC_UI_HUD_GROUP=${{ matrix.variant }}
          } else {
            cmake -S . -B build/ci -G $generator -A Win32 -DABC_UI_HUD_GROUP=${{ matrix.variant }}
          }

      - name: Build (${{ matrix.config }}, ${{ matrix.variant }})
        if: matrix.config == 'Debug'
        shell: pwsh
        run: cmake --build build/ci --config Debug --parallel 1

      - name: Package Release (${{ matrix.variant }})
        if: matrix.config == 'Release'
        shell: pwsh
        run: cmake --build build/ci --config Release --target dist --parallel 1

      - name: Create aggregate game package (${{ matrix.variant }})
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          $variant = "${{ matrix.variant }}"
          $game = "build/ci/game-package-$variant"
          Remove-Item -Recurse -Force $game -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $game | Out-Null
          $core = (Get-ChildItem "build/ci/dist/AbcCore-*.zip" | Select-Object -First 1).FullName
          $ui = (Get-ChildItem "build/ci/dist/AbcUi-*.zip" | Select-Object -First 1).FullName
          $essential = (Get-ChildItem "build/ci/dist/AbcEssential-*.zip" | Select-Object -First 1).FullName
          Expand-Archive -Path $core -DestinationPath $game -Force
          Expand-Archive -Path $ui -DestinationPath $game -Force
          Expand-Archive -Path $essential -DestinationPath $game -Force
          Copy-Item README.md "$game/README.md" -Force
          # Every module archive puts svencoop/ at its root and is merged by
          # extracting all three into one directory. Verify the merged tree
          # before zipping so an incomplete release fails here instead of
          # shipping a package that misses a plugin.
          $required = @(
            "svencoop/metahook/dlls/AbcCore/AbcCore.dll",
            "svencoop/metahook/plugins/AbcEssential.dll",
            "svencoop/metahook/plugins/AbcUi.dll",
            "svencoop/metahook/gamedata/abc/index.json",
            "svencoop/abc/abcui/modules",
            "svencoop/abc/mdl",
            "svencoop/abc/spr"
          )
          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path $game $path))) {
              throw "Merged package is missing $path"
            }
          }
          # The two HUD groups replace one another, so each archive must carry
          # exactly its own readouts: classic health/ammo/flashlight, or the
          # division module instead.
          $modules = Join-Path $game "svencoop/abc/abcui/modules"
          $division = Get-ChildItem $modules -Filter "abcui.division-*.zip" -ErrorAction SilentlyContinue
          $classic = Get-ChildItem $modules -Filter "abcui.health-*.zip" -ErrorAction SilentlyContinue
          if ($variant -eq "division") {
            if (-not $division) { throw "Division package is missing abcui.division" }
            foreach ($name in @("abcui.health-*.zip", "abcui.ammo-*.zip", "abcui.flashlight-*.zip")) {
              if (Get-ChildItem $modules -Filter $name -ErrorAction SilentlyContinue) {
                throw "Division package still contains $name"
              }
            }
          } else {
            if (-not $classic) { throw "Classic package is missing abcui.health" }
            if ($division) { throw "Classic package contains abcui.division" }
          }
          $zip = Join-Path $PWD "build/ci/dist/ABCEnchance-$variant-game.zip"
          cmake -E chdir $game cmake -E tar cf $zip --format=zip -- svencoop README.md
          Get-ChildItem "build/ci/dist" | Select-Object Name, Length

      - name: Upload packages (${{ matrix.variant }})
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ABCEnchance-packages-${{ matrix.variant }}
          path: build/ci/dist/*.zip
          if-no-files-found: error

  release:
    name: Publish aggregate release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download classic packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: ABCEnchance-packages-classic
          path: packages/classic

      - name: Download division packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: ABCEnchance-packages-division
          path: packages/division

      - name: Stage the release assets
        shell: bash
        run: |
          set -euo pipefail
          ls -l packages/classic packages/division
          tag="${GITHUB_REF_NAME//\//-}"
          mkdir -p release
          mv packages/classic/ABCEnchance-classic-game.zip "release/ABCEnchance-${tag}.zip"
          mv packages/division/ABCEnchance-division-game.zip "release/ABCEnchance-division-${tag}.zip"
          test "$(find release -maxdepth 1 -type f -name 'ABCEnchance-*.zip' | wc -l)" -eq 2
          unzip -l "release/ABCEnchance-${tag}.zip" | head -20
          unzip -l "release/ABCEnchance-division-${tag}.zip" | head -20

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: ABCEnchance ${{ github.ref_name }}
          generate_release_notes: true
          files: release/ABCEnchance-*.zip
          fail_on_unmatched_files: true
